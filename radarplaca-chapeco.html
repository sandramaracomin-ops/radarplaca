<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadarPlaca — Chapeco</title>
<style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Barlow:wght@400;500;600;700;800&display=swap');
:root{--bg:#0d0f14;--bg2:#12151c;--card:#181c26;--border:#1f2535;--border2:#2a3045;--amber:#f59e0b;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--text:#e2e8f0;--sub:#94a3b8;--dim:#475569;--mono:'JetBrains Mono',monospace;--sans:'Barlow',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 18px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px}
.bico{width:32px;height:32px;background:linear-gradient(135deg,var(--amber),#d97706);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}
.bname{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:1px}.bname span{color:var(--amber)}
.cam-label{font-family:var(--mono);font-size:11px;padding:3px 12px;border-radius:10px;border:1px solid;background:rgba(0,0,0,.3)}
.hdr-right{display:flex;align-items:center;gap:10px}
.spill{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid;cursor:pointer;background:none;transition:all .3s}
.spill.off{color:var(--dim);border-color:var(--border2)}.spill.on{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.spill.on::before{content:"";width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.clock{font-family:var(--mono);font-size:11px;color:var(--dim)}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;gap:8px}
.cam-bar-left{display:flex;align-items:center;gap:10px}
.cam-topic{font-family:var(--mono);font-size:10px;color:var(--dim)}
.campill{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:10px;border:1px solid var(--border2);color:var(--dim);transition:all .3s}
.cam-bar-right{display:flex;align-items:center;gap:8px}
.bmon{padding:8px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.bstart{background:var(--green);color:#000}.bstop{background:var(--red);color:#fff}
.imp-btn{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:7px 12px;color:var(--sub);font-size:11px;cursor:pointer;font-family:var(--mono);transition:all .2s}
.imp-btn:hover{border-color:var(--amber);color:var(--amber)}
.irow{display:flex;gap:5px}
.pfield{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;color:var(--text);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;outline:none;width:150px;transition:border-color .2s}
.pfield:focus{border-color:var(--amber)}.pfield::placeholder{color:var(--dim);font-size:10px;font-weight:400;letter-spacing:0}
.btn-add{background:var(--amber);color:#000;border:none;border-radius:6px;padding:7px 12px;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--mono)}
.toolbar{padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap}
.ftabs{display:flex;background:var(--bg);border-radius:7px;padding:3px;gap:2px}
.ftab{padding:5px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;background:none;border:none;color:var(--dim);font-family:var(--sans);transition:all .15s}
.ftab.active{background:var(--card);color:var(--text)}
.sbox{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:7px 12px;color:var(--text);font-family:var(--mono);font-size:11px;letter-spacing:1px;outline:none;width:180px;transition:border-color .2s}
.sbox:focus{border-color:var(--amber)}
.stats{display:flex;gap:1px}
.stat{background:var(--card);padding:5px 14px;text-align:center;border:1px solid var(--border)}
.stat:first-child{border-radius:6px 0 0 6px}.stat:last-child{border-radius:0 6px 6px 0}
.snum{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1;color:var(--amber)}.snum.r{color:var(--red)}.snum.g{color:var(--green)}
.slbl{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.body-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tarea{flex:1;overflow-y:auto;padding:14px 18px}.tarea::-webkit-scrollbar{width:4px}.tarea::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;padding:0 12px 10px;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid rgba(31,37,53,.6);cursor:pointer;transition:background .1s}tbody tr:hover{background:var(--card)}
tbody tr.dr td:first-child{border-left:3px solid var(--red)}tbody tr.wr td:first-child{border-left:3px solid var(--amber)}
tbody td{padding:10px 12px;vertical-align:middle}
.tdp{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:2px}
.stag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.sok{background:rgba(71,85,105,.2);color:var(--dim)}.swn{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.sdn{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.sap{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3)}
tbody tr.apr td:first-child{border-left:3px solid var(--green)}
tbody tr.apr td{text-decoration:line-through;opacity:.55}
tbody tr.apr td:nth-child(2),tbody tr.apr td:nth-child(4){text-decoration:none}
.bapr{margin-top:2px;margin-bottom:12px;width:100%;padding:9px;border-radius:6px;font-weight:700;font-size:12px;font-family:var(--sans);cursor:pointer;border:none}
.bapr-mk{background:var(--green);color:#000}
.bapr-un{background:var(--card);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.tdt{display:flex;flex-wrap:wrap;gap:3px}
.tc{font-family:var(--mono);font-size:10px;background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:2px 6px;color:var(--dim)}
.tc.fi{color:var(--green);border-color:rgba(34,197,94,.25)}.tc.la{color:var(--amber);border-color:rgba(245,158,11,.25)}
.det{background:var(--bg2);border-top:2px solid var(--border2);display:none;flex-shrink:0;max-height:30vh;overflow-y:auto}
.det.open{display:block}.detin{padding:14px 18px}
.dettop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.detplate{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:4px;color:var(--amber)}
.bclose{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:5px;transition:background .15s}
.bclose:hover{background:var(--card)}
.dmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.dm{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px}
.dmn{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1}.dml{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.tlwrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:12px}
.tli{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 10px;font-family:var(--mono);font-size:11px}
.tln{color:var(--dim);font-size:9px}
.phwrap{display:flex;gap:8px;flex-wrap:wrap}
.phthumb{width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:border-color .2s}
.phthumb:hover{border-color:var(--amber)}
.logfeed{position:fixed;bottom:16px;right:16px;width:280px;max-height:200px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:5px;z-index:200;pointer-events:none}
.logi{background:var(--card);border:1px solid var(--border2);border-radius:7px;padding:8px 11px;font-family:var(--mono);font-size:10px;pointer-events:all;display:flex;gap:7px;align-items:flex-start}
.logi.i{border-left:3px solid var(--blue)}.logi.s{border-left:3px solid var(--green)}.logi.w{border-left:3px solid var(--amber)}.logi.d{border-left:3px solid var(--red)}
.li{font-size:13px;flex-shrink:0}.lt{flex:1;line-height:1.4;color:var(--sub)}
.alov{display:none;position:fixed;inset:0;background:rgba(239,68,68,.12);z-index:300;align-items:center;justify-content:center}
.alov.show{display:flex}
.albox{background:var(--bg2);border:2px solid var(--red);border-radius:12px;padding:28px 36px;text-align:center;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.alico{font-size:40px;margin-bottom:10px}.altit{font-size:20px;font-weight:800;color:var(--red);font-family:var(--mono);letter-spacing:2px;margin-bottom:6px}
.alplate{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:4px;color:var(--text);margin-bottom:6px}
.alimg{width:190px;height:126px;object-fit:cover;border-radius:8px;margin-bottom:12px;border:1px solid var(--border2)}
.alsub{font-size:13px;color:var(--sub);margin-bottom:18px}
.bdismiss{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 26px;font-weight:700;font-size:14px;cursor:pointer}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);gap:10px;padding:60px;text-align:center}
.eico{font-size:40px}.etit{font-size:15px;font-weight:600;color:var(--sub)}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;align-items:center;justify-content:center;cursor:pointer}
.lb.show{display:flex}.lb img{max-width:93vw;max-height:93vh;border-radius:8px}</style>
</head>
<body>
<div class="hdr">
  <div class="brand">
    <div class="bico">&#x1F697;</div>
    <div class="bname">RADAR<span>PLACA</span></div>
    <div class="cam-label" style="color:#3b82f6;border-color:#3b82f6">Chapeco</div>
  </div>
  <div class="hdr-right">
    <button class="spill off" id="pill" onclick="toggleMonitor()">PARADO</button>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</div>
<div class="cam-bar">
  <div class="cam-bar-left">
    <div style="font-family:var(--mono);font-size:10px;font-weight:700;color:#3b82f6">chapeco_felipe</div>
    <div class="campill" id="campill">OFF</div>
  </div>
  <div class="cam-bar-right">
    <button class="bmon bstart" id="btnMon" onclick="toggleMonitor()">INICIAR</button>
    <label class="imp-btn" for="impFile">&#x1F4C2; Importar backup</label>
    <input type="file" id="impFile" accept=".json" style="display:none" onchange="importBackup(event)">
    <button class="bmon bstop" onclick="clearExtra()">&#x1F9F9; Limpar histórico importado</button>
    <div class="irow">
      <input class="pfield" id="plateInput" maxlength="8" placeholder="Placa manual..." autocomplete="off">
      <button class="btn-add" onclick="addManual()">ADD</button>
    </div>
  </div>
</div>
<div class="toolbar">
  <div class="ftabs">
    <button class="ftab active" onclick="setFilter('all',this)">Todos</button>
    <button class="ftab" onclick="setFilter('repeat',this)">Recorrentes</button>
    <button class="ftab" onclick="setFilter('alert',this)">&#x26A0; Alertas</button>
    <button class="ftab" onclick="setFilter('apr',this)">&#x2705; Apreendidos</button>
  </div>
  <input class="sbox" id="searchBox" placeholder="Buscar placa..." oninput="renderTable()">
  <div class="stats">
    <div class="stat"><div class="snum g" id="sTotal">0</div><div class="slbl">Placas</div></div>
    <div class="stat"><div class="snum" id="sRepeat">0</div><div class="slbl">Recorrentes</div></div>
    <div class="stat"><div class="snum r" id="sAlert">0</div><div class="slbl">Alertas</div></div>
  </div>
</div>
<div class="body-wrap">
  <div class="tarea" id="tableArea"></div>
  <div class="det" id="detPanel">
    <div class="detin">
      <div class="dettop">
        <div><div style="font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Detalhes</div><div class="detplate" id="dPlate">-</div></div>
        <button class="bclose" onclick="closeDet()">&#x2715;</button>
      </div>
      <div id="dAprBtn"></div>
      <div class="dmeta" id="dMeta"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px">Linha do Tempo (mais recente primeiro)</div>
      <div class="tlwrap" id="dTimeline"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;margin-top:10px">Fotos</div>
      <div class="phwrap" id="dPhotos"></div>
    </div>
  </div>
</div>
<div class="logfeed" id="logFeed"></div>
<div class="alov" id="alertOv">
  <div class="albox">
    <div class="alico">&#x1F6A8;</div>
    <div class="altit">VEICULO REPETIDO</div>
    <div class="alplate" id="alPlate">-</div>
    <img class="alimg" id="alImg" src="" onerror="this.style.display='none'" style="display:none">
    <div class="alsub" id="alSub"></div>
    <button class="bdismiss" onclick="dismissAl()">ENTENDIDO</button>
  </div>
</div>
<div class="lb" id="lb" onclick="this.classList.remove('show')"><img id="lbImg" src=""></div>

var TOPIC="chapeco_felipe",LABEL="Chapeco",SUBID=85202256;

var IDB_STORE="photos";
function idbOpen(){
  return new Promise(function(resolve,reject){
    if(!window.indexedDB){reject();return;}
    var req=indexedDB.open("rp_photos_db",1);
    req.onupgradeneeded=function(){req.result.createObjectStore(IDB_STORE,{keyPath:"url"});};
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=function(){reject(req.error);};
  });
}
function idbGet(url){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      var tx=db.transaction(IDB_STORE,"readonly"),r=tx.objectStore(IDB_STORE).get(url);
      r.onsuccess=function(){resolve(r.result?r.result.data:null);};
      r.onerror=function(){resolve(null);};
    });
  }).catch(function(){return null;});
}
function idbSet(url,data){
  idbOpen().then(function(db){
    db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put({url:url,data:data});
  }).catch(function(){});
}
function cachePhoto(url){
  if(!url)return;
  var img=new Image();
  img.crossOrigin="anonymous";
  img.onload=function(){
    try{
      var c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext("2d").drawImage(img,0,0);
      idbSet(url,c.toDataURL("image/jpeg",0.85));
    }catch(e){}
  };
  img.src=url;
}
function loadImgCached(imgEl,url){
  idbGet(url).then(function(cached){
    if(cached){imgEl.src=cached;}
    else{imgEl.src=url;imgEl.addEventListener("load",function(){cachePhoto(url);},{once:true});}
  });
}

function init(){
  plates={};
  for(var p in H){plates[p]={times:H[p].times.slice(),cameras:H[p].cameras.slice(),images:H[p].images.slice(),firstSeen:H[p].firstSeen,lastSeen:H[p].lastSeen};}
  var ex=localStorage.getItem("ex_"+TOPIC);
  if(ex){
    var extra=JSON.parse(ex);
    for(var p in extra){
      if(!plates[p])plates[p]={times:[],cameras:[],images:[],firstSeen:"",lastSeen:""};
      for(var i=0;i<extra[p].times.length;i++){
        if(!plates[p].times.includes(extra[p].times[i])){
          plates[p].times.push(extra[p].times[i]);
          plates[p].cameras.push(extra[p].cameras[i]||"-");
          if(!plates[p].images)plates[p].images=[];
          plates[p].images.push(extra[p].images?extra[p].images[i]||"":"");
          plates[p].lastSeen=extra[p].times[i];
          if(!plates[p].firstSeen)plates[p].firstSeen=extra[p].times[i];
        }
      }
    }
  }
  try{apr=JSON.parse(localStorage.getItem("apr_"+TOPIC)||"{}");}catch(e){apr={};}
  render();
  log(Object.keys(plates).length+" placas carregadas","s");
}

function saveApr(){localStorage.setItem("apr_"+TOPIC,JSON.stringify(apr));}
function toggleApreendido(plate){
  if(apr[plate]){delete apr[plate];log(plate+" removido dos apreendidos","w");}
  else{apr[plate]=true;log(plate+" marcado como apreendido!","s");}
  saveApr();render();openDet(plate);
}

function saveExtra(){
  var ex={};
  for(var p in plates){
    var newT=plates[p].times.filter(function(t){return !H[p]||!H[p].times.includes(t);});
    if(newT.length>0){
      ex[p]={times:[],cameras:[],images:[],firstSeen:newT[0],lastSeen:newT[newT.length-1]};
      newT.forEach(function(t){var idx=plates[p].times.indexOf(t);ex[p].times.push(t);ex[p].cameras.push(plates[p].cameras[idx]||"-");ex[p].images.push(plates[p].images?plates[p].images[idx]||"":"");});
    }
  }
  localStorage.setItem("ex_"+TOPIC,JSON.stringify(ex));
}

function clearExtra(){
  if(!confirm("Isso apaga o historico IMPORTADO desta camera (mantem os dados originais). Continuar?"))return;
  localStorage.removeItem("ex_"+TOPIC);
  init();
  log("Historico importado foi limpo!","s");
}

function cleanP(r){return r.replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,7);}
function fmtP(r){var c=cleanP(r);return c.length===7?c.slice(0,3)+"-"+c.slice(3):c;}
function nowStr(){var d=new Date();return[("0"+d.getDate()).slice(-2),("0"+(d.getMonth()+1)).slice(-2),d.getFullYear()].join("/")+' '+[("0"+d.getHours()).slice(-2),("0"+d.getMinutes()).slice(-2),("0"+d.getSeconds()).slice(-2)].join(":");}
function tsStr(ts){var d=new Date(ts*1000);return[("0"+d.getDate()).slice(-2),("0"+(d.getMonth()+1)).slice(-2),d.getFullYear()].join("/")+' '+[("0"+d.getHours()).slice(-2),("0"+d.getMinutes()).slice(-2),("0"+d.getSeconds()).slice(-2)].join(":");}
function risk(n){return n>=3?"d":n>=2?"w":"o";}

function registerPlate(raw,ts,cam,img,silent){
  var clean=cleanP(raw);if(clean.length<7)return;
  var plate=fmtP(raw);ts=ts||nowStr();cam=cam||"-";img=img||"";
  if(!plates[plate])plates[plate]={times:[],cameras:[],images:[],firstSeen:ts,lastSeen:ts};
  if(plates[plate].times.includes(ts))return;
  plates[plate].times.push(ts);plates[plate].cameras.push(cam);
  if(!plates[plate].images)plates[plate].images=[];
  plates[plate].images.push(img);plates[plate].lastSeen=ts;
  saveExtra();
  if(!silent){
    var count=plates[plate].times.length;
    if(count>=3){triggerAl(plate,count,img);log("ALERTA! "+plate+" "+count+"x","d");}
    else if(count===2){triggerAl(plate,count,img);log(plate+" passou 2x!","w");}
    else log("Nova: "+plate,"s");
    render();
  }
}

function addManual(){
  var v=document.getElementById("plateInput").value;if(!v.trim())return;
  registerPlate(v,null,null,null,false);document.getElementById("plateInput").value="";
}

function importBackup(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result),notifs=data.notifications||[],cnt=0;
      notifs=notifs.filter(function(n){
        if(n.topic)return n.topic===TOPIC;
        if(SUBID)return String(n.subscriptionId)===String(SUBID);
        return true;
      });
      notifs.sort(function(a,b){return(a.timestamp||0)-(b.timestamp||0);});
      for(var i=0;i<notifs.length;i++){
        var n=notifs[i],title=n.title||"",msg=n.message||"";
        var ts=n.timestamp?tsStr(n.timestamp):"";
        var pm=title.match(/LOCALIZADA\s+([A-Z0-9]{7})/)||msg.match(/Placa:\s*([A-Z0-9]{7})/);
        if(!pm)continue;
        var img=(n.attachment&&n.attachment.url)?n.attachment.url:"";
        var cm=msg.match(/[Cc][\u00e2a]mera:\s*([^\n]+)/);
        registerPlate(pm[1],ts,cm?cm[1].trim():"-",img,true);cnt++;
      }
      render();log(cnt+" registros importados!","s");
    }catch(err){log("Erro: "+err.message,"d");}
  };
  reader.readAsText(file);e.target.value="";
}

function toggleMonitor(){MON?stopMon():startMon();}
async function startMon(){
  MON=true;updateUI(true);log("Conectando...","i");
  try{
    setPill("HIST...","#888");
    var r=await fetch("https://ntfy.sh/"+TOPIC+"/json?poll=1&since=all");
    if(r.ok){
      var text=await r.text(),cnt=0;
      text.split("\n").filter(Boolean).forEach(function(line){
        try{var m=JSON.parse(line);if(m.event==="message"){processMsg(m,true);cnt++;}}catch(e){}
      });
      log("NTFY: "+cnt+" msgs","s");render();
    }
  }catch(e){log("Hist indisponivel","w");}
  CTL=new AbortController();
  try{
    var r=await fetch("https://ntfy.sh/"+TOPIC+"/json?since=all",{signal:CTL.signal});
    var reader=r.body.getReader(),dec=new TextDecoder();
    setPill("AO VIVO","var(--green)");log("Ao vivo!","s");
    while(true){
      var res=await reader.read();if(res.done)break;
      dec.decode(res.value,{stream:true}).split("\n").filter(Boolean).forEach(function(line){
        try{var m=JSON.parse(line);if(m.event==="message")processMsg(m,false);}catch(e){}
      });
    }
  }catch(e){
    setPill("OFF","var(--dim)");
    if(e.name!=="AbortError"&&MON)setTimeout(startMon,5000);
  }
}
function stopMon(){MON=false;if(CTL)CTL.abort();updateUI(false);setPill("OFF","var(--dim)");log("Parado","i");}
function updateUI(on){
  var p=document.getElementById("pill"),b=document.getElementById("btnMon");

}
function setPill(t,c){var el=document.getElementById("campill");if(!el)return;el.textContent=t;el.style.color=c;el.style.borderColor=c;}
function processMsg(msg,silent){
  var id=msg.id||"";if(id&&SEEN[id])return;if(id)SEEN[id]=1;
  var text=(msg.title||"")+" "+(msg.message||"");
  var pm=text.match(/\b([A-Z]{3}-?[0-9]{4}|[A-Z]{3}-?[0-9][A-Z][0-9]{2})\b/i);
  var cm=text.match(/[Cc][\u00e2a]mera[\s:]+([^\n,]+)/);
  var img=(msg.attachment&&msg.attachment.url)?msg.attachment.url:"";
  var ts=msg.time?tsStr(msg.time):nowStr();
  if(pm)registerPlate(pm[1].replace("-",""),ts,cm?cm[1].trim():"-",img,silent);
}

  var q=document.getElementById("searchBox").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  var entries=Object.entries(plates);
  if(fil==="repeat")entries=entries.filter(function(e){return e[1].times.length>=2&&!apr[e[0]];});
  if(fil==="alert")entries=entries.filter(function(e){return e[1].times.length>=3&&!apr[e[0]];});
  if(fil==="apr")entries=entries.filter(function(e){return apr[e[0]];});
  if(q)entries=entries.filter(function(e){return e[0].replace("-","").includes(q);});
  entries.sort(function(a,b){return b[1].times.length-a[1].times.length;});
  if(!entries.length){area.innerHTML="<div class='empty'><div class='eico'>&#x1F50D;</div><div class='etit'>"+(Object.keys(plates).length===0?"Nenhuma placa ainda":"Sem resultados")+"</div></div>";return;}
  var table=document.createElement("table");
  var thead=document.createElement("thead");
  thead.innerHTML="<tr><th>Placa</th><th>Status</th><th>Passagens</th><th>Foto</th><th>Horarios (mais recente primeiro)</th><th>Primeiro avistamento</th></tr>";
  table.appendChild(thead);
  var tbody=document.createElement("tbody");
  entries.forEach(function(e){
    var plate=e[0],d=e[1],count=d.times.length,r=risk(count),isApr=!!apr[plate];
    var tr=document.createElement("tr");if(isApr)tr.className="apr";else if(r==="d")tr.className="dr";else if(r==="w")tr.className="wr";
    var tag=isApr?"<span class='stag sap'>&#x2705; APREENDIDO</span>":r==="d"?"<span class='stag sdn'>&#x26A0; ALERTA</span>":r==="w"?"<span class='stag swn'>&#x1F501; Recorrente</span>":"<span class='stag sok'>-</span>";
    var tcs=d.times.slice().reverse().map(function(t,i){var cl=i===0?" la":i===d.times.length-1?" fi":"";return "<span class='tc"+cl+"'>"+t+"</span>";}).join("");
    var imgs=(d.images||[]).filter(Boolean),li=imgs.length?imgs[imgs.length-1]:"";
    var tdP=document.createElement("td");tdP.className="tdp";tdP.textContent=plate;
    var tdT=document.createElement("td");tdT.innerHTML=tag;
    var tdC=document.createElement("td");tdC.textContent=count;tdC.style.cssText="font-family:var(--mono);font-size:14px;color:var(--sub);text-align:center";
    var tdPh=document.createElement("td");
    if(li){var img=document.createElement("img");img.style.cssText="width:52px;height:34px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer";img.loading="lazy";img.onerror=function(){var d=document.createElement("div");d.textContent="foto expirada";d.style.cssText="font-size:9px;color:var(--dim);font-style:italic";this.replaceWith(d);};img.addEventListener("click",function(ev){ev.stopPropagation();openLb(li);});tdPh.appendChild(img);loadImgCached(img,li);}else{tdPh.textContent="-";tdPh.style.color="var(--dim)";}
    var tdTm=document.createElement("td");tdTm.innerHTML="<div class='tdt'>"+tcs+"</div>";
    var tdF=document.createElement("td");tdF.textContent=d.firstSeen||"-";tdF.style.cssText="font-family:var(--mono);font-size:11px;color:var(--dim)";
    tr.appendChild(tdP);tr.appendChild(tdT);tr.appendChild(tdC);tr.appendChild(tdPh);tr.appendChild(tdTm);tr.appendChild(tdF);
    tr.addEventListener("click",function(){selPlate(plate);});
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);area.innerHTML="";area.appendChild(table);
}
function selPlate(plate){sel=plate;openDet(plate);}
function openDet(plate){
  var d=plates[plate];if(!d)return;
  document.getElementById("detPanel").className="det open";
  document.getElementById("dPlate").textContent=plate;
  var count=d.times.length,r=risk(count),avg="-";
  if(count>=2){try{
    var parsed=d.times.map(function(t){var pts=t.split(" ");if(pts.length<2)return null;var dp=pts[0].split("/"),tp=pts[1].split(":");return new Date(dp[2],dp[1]-1,dp[0],tp[0],tp[1],tp[2]||0);}).filter(Boolean);
    if(parsed.length>=2){var diffs=[];for(var i=1;i<parsed.length;i++)diffs.push(Math.abs(parsed[i]-parsed[i-1])/60000);var a=diffs.reduce(function(x,y){return x+y;},0)/diffs.length;avg=a<60?Math.round(a)+"min":(a/60).toFixed(1)+"h";}
  }catch(e){}}
  var nc=r==="d"?"var(--red)":r==="w"?"var(--amber)":"var(--text)";
  var isApr=!!apr[plate];
  document.getElementById("dAprBtn").innerHTML=isApr
    ?"<button class='bapr bapr-un' onclick=\"toggleApreendido('"+plate+"')\">&#x274C; Remover Apreensao</button>"
    :"<button class='bapr bapr-mk' onclick=\"toggleApreendido('"+plate+"')\">&#x2705; Marcar Apreendido</button>";
  document.getElementById("dMeta").innerHTML=
    "<div class='dm'><div class='dmn' style='color:"+nc+"'>"+count+"</div><div class='dml'>Passagens</div></div>"
    +"<div class='dm'><div class='dmn'>"+avg+"</div><div class='dml'>Intervalo medio</div></div>"
    +"<div class='dm'><div class='dmn' style='font-size:12px'>"+(d.firstSeen||"-")+"</div><div class='dml'>Primeiro avistamento</div></div>"
    +"<div class='dm'><div class='dmn' style='font-size:12px'>"+(d.lastSeen||"-")+"</div><div class='dml'>Ultimo avistamento</div></div>";
  var tl=document.getElementById("dTimeline");tl.innerHTML="";
  d.times.slice().reverse().forEach(function(t,i){
    var div=document.createElement("div");div.className="tli";
    div.innerHTML="<span class='tln'>#"+(d.times.length-i)+"</span><span>"+t+"</span>";
    tl.appendChild(div);
    if(i<d.times.length-1){var arr=document.createElement("span");arr.textContent="<";arr.style.cssText="color:var(--dim);margin:0 2px";tl.appendChild(arr);}
  });
  var ph=document.getElementById("dPhotos");ph.innerHTML="";
  var imgs=(d.images||[]).filter(Boolean);
  if(imgs.length){imgs.forEach(function(u){var img=document.createElement("img");img.className="phthumb";img.loading="lazy";img.onerror=function(){var d=document.createElement("div");d.textContent="foto expirada";d.style.cssText="font-size:10px;color:var(--dim);font-style:italic;padding:8px";this.replaceWith(d);};img.addEventListener("click",function(){openLb(u);});ph.appendChild(img);loadImgCached(img,u);});}
  else{var sp=document.createElement("span");sp.textContent="Sem fotos";sp.style.cssText="font-size:11px;color:var(--dim)";ph.appendChild(sp);}
}
function closeDet(){document.getElementById("detPanel").className="det";sel=null;}
function openLb(url){document.getElementById("lbImg").src=url;document.getElementById("lb").classList.add("show");}
document.getElementById("plateInput").addEventListener("keydown",function(e){if(e.key==="Enter")addManual();});
setInterval(function(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("pt-BR");},1000);
init();

</script>
</body>
</html>
